name: Build

on:
  push:

jobs:
  domain:
    name: Lib
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build Lib
        run: ./gradlew :domain:usecases:build

  e2e:
    runs-on: ubuntu-latest
    name: Lib E2E
    needs: domain
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: [ 'nextcloud:latest', 'nextcloud:stable', 'nextcloud:production' ]
    env:
      NEXTCLOUD_ADMIN_USER: Test
      NEXTCLOUD_ADMIN_PASSWORD: Test
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    services:
      nextcloud:
        image: ${{ matrix.nextcloud-version }}
        env:
          SQLITE_DATABASE: db.sqlite
          NEXTCLOUD_ADMIN_USER: ${{ env.NEXTCLOUD_ADMIN_USER }}
          NEXTCLOUD_ADMIN_PASSWORD: ${{ env.NEXTCLOUD_ADMIN_PASSWORD }}
          NEXTCLOUD_TRUSTED_DOMAINS: ${{ env.NEXTCLOUD_TRUSTED_DOMAINS }}
        ports:
          - 80:80
        options: >-
          --health-cmd "curl GET 'http://Test:Test@localhost/ocs/v2.php/apps/serverinfo/api/v1/info' -f -H 'OCS-APIRequest: true' || exit 1"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10
          --health-start-period 3s
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Deck app
        run: |
          docker exec $(docker ps -f "name=nextcloud" -q) bash -c 'runuser -u www-data -- php occ app:install deck'

      - name: Verify Nextcloud setup
        run: |
          curl -v -X GET "http://$NEXTCLOUD_ADMIN_USER:$NEXTCLOUD_ADMIN_PASSWORD@$NEXTCLOUD_TRUSTED_DOMAINS:$NEXTCLOUD_PORT/ocs/v2.php/cloud/capabilities?format=json" -H 'OCS-APIRequest: true' | jq

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Run E2E
        run: ./gradlew :domain:usecases:test -PincludeE2E=true -Pe2eParallel=2 --stacktrace

      - name: Generate E2E Report
        if: always()
        env:
          NC_VER: ${{ matrix.nextcloud-version }}
        run: |
          python3 - <<EOF
          import xml.etree.ElementTree as ET
          import glob
          import os

          total = 0
          passed = 0
          rows = []
          visual_progress = []

          for f in glob.glob('domain/usecases/build/test-results/test/*.xml'):
              try:
                  tree = ET.parse(f)
                  for tc in tree.iter('testcase'):
                      total += 1
                      name = tc.get('name')
                      cls = tc.get('classname')
                      time = tc.get('time')
                      
                      is_failed = tc.find('failure') is not None or tc.find('error') is not None
                      status = "❌ Failure" if is_failed else "✅ Success"
                      if not is_failed:
                          passed += 1
                          visual_progress.append("🟩")
                      else:
                          visual_progress.append("⬜")
                      
                      rows.append(f"| {cls}.{name} | {status} | {time}s |")
              except Exception:
                  pass

          if total > 0:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
                  s.write(f"### E2E Test Results ({os.environ.get('NC_VER')})\n\n")
                  s.write("".join(visual_progress) + f" {passed}/{total} tests passed\n\n")
                  s.write("<details>\n<summary>Test Details</summary>\n\n")
                  s.write("| Test | Status | Time |\n")
                  s.write("| :--- | :--- | :--- |\n")
                  s.write("\n".join(rows) + "\n\n")
                  s.write("</details>\n")
          EOF

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: domain-e2e-report
          path: |
            **/build/reports/tests/test/**
            ${{ runner.temp }}/.gradle-actions/build-results/*.json

  javafx:
    name: App (PC)
    runs-on: ubuntu-latest
    needs: domain
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Run Tests
        run: ./gradlew :app:javafx:test --stacktrace

      - name: Build App
        run: ./gradlew :app:javafx:build

      - name: Upload Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: app/javafx/build/libs/*all.jar

  android:
    name: App (Android)
    runs-on: ubuntu-latest
    needs: domain

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build App
        run: ./gradlew :app:android:assemble

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/android/build/outputs/apk/debug/android-debug.apk

  cli:
    name: App (CLI)
    runs-on: ubuntu-latest
    needs: domain

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build App
        run: ./gradlew :app:cli:build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli
          path: app/cli/build/libs/cli-all.jar
